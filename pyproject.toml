[project]
name = "rs-linkedin-agent"
version = "0.1.0"
description = "RS LinkedIn Agent — Claude Edition: compliant networking and personal-branding assistant"
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.40",
  "uvicorn[standard]>=0.30",
  "requests>=2.32",
  "cryptography>=43",
  "itsdangerous>=2.2",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "pip-audit>=2.7", "types-requests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = ["S101", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["rs_agent"]
