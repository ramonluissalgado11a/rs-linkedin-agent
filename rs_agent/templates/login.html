<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RS LinkedIn Agent</title><style>body{font-family:system-ui;background:#0b1b2e;color:#e8eef5;display:grid;place-items:center;min-height:100vh;margin:0}
form{background:#12304f;padding:24px;border-radius:12px;width:min(360px,90vw)}input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:0;font-size:16px}
button{background:#f2b705;font-weight:700}.err{color:#ff8a80}</style></head><body><form method="post" action="/login">
<h2>RS LinkedIn Agent</h2>{% if error %}<p class="err">{{ error }}</p>{% endif %}<input type="password" name="token" placeholder="Admin token" autocomplete="current-password" required>
<button type="submit">Sign in</button></form></body></html>
